version: 2

project_name: openlicensd

git:
  ignore_tags:
    - "sdk/*/v*"

before:
  hooks:
    - sh -c "cd ui && npm ci && npm run generate"

builds:
  - id: openlicensd
    dir: server
    main: ./cmd/openlicensd
    binary: openlicensd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/alvarorg14/openlicensd/server/internal/version.Version={{.Version}}

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - NOTICE*

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  abbrev: -1
  groups:
    - title: New Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Improvements
      regexp: '^.*?(enhancement|perf|refactor)(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: CI
      regexp: '^.*?(ci|chore)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^Merge '
      - '^wip:'

release:
  mode: keep-existing
  prerelease: auto
  extra_files:
    - glob: docs/openapi.yaml

dockers_v2:
  - images:
      - ghcr.io/alvarorg14/openlicensd
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    labels:
      org.opencontainers.image.title: openlicensd
      org.opencontainers.image.description: Open source license server
    annotations:
      org.opencontainers.image.url: https://github.com/alvarorg14/openlicensd
      org.opencontainers.image.source: https://github.com/alvarorg14/openlicensd
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
