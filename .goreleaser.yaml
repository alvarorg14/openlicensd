version: 2

project_name: openlicensd

before:
  hooks:
    - cd ui && npm ci && npm run generate

builds:
  - id: openlicensd
    dir: server
    main: ./cmd/openlicensd
    binary: openlicensd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
