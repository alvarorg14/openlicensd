name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ !startsWith(github.event.release.tag_name, 'sdk/go/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Assert server tag format
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "Server release tag must be vX.Y.Z or vX.Y.Z-rc.N (got: $TAG)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release tag
        run: echo "GORELEASER_CURRENT_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"

      - name: Stamp OpenAPI version
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}"
          sed -i "s/^  version: 0.0.0-dev$/  version: ${VERSION}/" docs/openapi.yaml
          grep -q "^  version: ${VERSION}$" docs/openapi.yaml
          # GoReleaser requires a clean git worktree; hide the publish-time stamp from status.
          git update-index --skip-worktree docs/openapi.yaml
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree still dirty after skip-worktree:"
            git status --porcelain
            exit 1
          fi

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.51.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.release.tag_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.3

      - name: Resolve container image digest
        id: image
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/alvarorg14/openlicensd:${VERSION}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ -z "${DIGEST}" ]; then
            echo "Failed to resolve digest for ${IMAGE}"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${IMAGE} -> ${DIGEST}"

      - name: Sign container image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/alvarorg14/openlicensd@${DIGEST}"

      - name: Generate container image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/alvarorg14/openlicensd
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Generate container image SBOMs
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/alvarorg14/openlicensd:${VERSION}"
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            outfile="openlicensd_${VERSION}_${arch}.spdx.json"
            syft "${IMAGE}" --platform "${platform}" --output "spdx-json=${outfile}"
          done

      - name: Upload image SBOMs to GitHub release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "${TAG}" \
            "openlicensd_${VERSION}_amd64.spdx.json" \
            "openlicensd_${VERSION}_arm64.spdx.json"

  trivy:
    name: Scan GHCR image
    needs: release
    if: ${{ !startsWith(github.event.release.tag_name, 'sdk/go/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Set image version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "IMAGE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "ghcr.io/alvarorg14/openlicensd:${IMAGE_VERSION}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/alvarorg14/openlicensd:${{ env.IMAGE_VERSION }}
          vuln-type: os,library
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release

  chart:
    name: Publish Helm chart
    if: ${{ !startsWith(github.event.release.tag_name, 'sdk/go/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Assert server tag format
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "Server release tag must be vX.Y.Z or vX.Y.Z-rc.N (got: $TAG)"
            exit 1
          fi

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Set chart version
        run: echo "CHART_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Package chart
        run: helm package charts/openlicensd --version "$CHART_VERSION" --app-version "$CHART_VERSION"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: helm push openlicensd-"$CHART_VERSION".tgz oci://ghcr.io/alvarorg14/charts
