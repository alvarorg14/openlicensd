apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openlicensd.fullname" . }}
  labels:
    {{- include "openlicensd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openlicensd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openlicensd.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openlicensd.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openlicensd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OPENLICENSD_ADDR
              value: {{ .Values.config.addr | quote }}
            - name: OPENLICENSD_SESSION_TTL_HOURS
              value: {{ .Values.config.sessionTTLHours | quote }}
            - name: OPENLICENSD_COOKIE_SECURE
              value: {{ .Values.config.cookieSecure | quote }}
            - name: OPENLICENSD_LOCAL_LOGIN_ENABLED
              value: {{ .Values.config.localLoginEnabled | quote }}
            - name: OPENLICENSD_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.config.bootstrapAdmin.email | quote }}
            - name: OPENLICENSD_BOOTSTRAP_ADMIN_NAME
              value: {{ .Values.config.bootstrapAdmin.name | quote }}
            - name: OPENLICENSD_HARBOR_ENABLED
              value: {{ .Values.config.harbor.enabled | quote }}
            {{- if .Values.config.harbor.enabled }}
            - name: OPENLICENSD_HARBOR_URL
              value: {{ required "config.harbor.url is required when config.harbor.enabled is true" .Values.config.harbor.url | quote }}
            - name: OPENLICENSD_HARBOR_PROJECTS
              value: {{ required "config.harbor.projects is required when config.harbor.enabled is true" .Values.config.harbor.projects | quote }}
            - name: OPENLICENSD_HARBOR_ROBOT_DURATION_DAYS
              value: {{ .Values.config.harbor.robotDurationDays | quote }}
            - name: OPENLICENSD_HARBOR_ROBOT_NAME_PREFIX
              value: {{ .Values.config.harbor.robotNamePrefix | quote }}
            - name: OPENLICENSD_HARBOR_INSECURE_SKIP_VERIFY
              value: {{ .Values.config.harbor.insecureSkipVerify | quote }}
            - name: OPENLICENSD_HARBOR_DEBUG
              value: {{ .Values.config.harbor.debug | quote }}
            {{- end }}
            - name: OPENLICENSD_OIDC_ENABLED
              value: {{ .Values.config.oidc.enabled | quote }}
            {{- if .Values.config.oidc.enabled }}
            - name: OPENLICENSD_OIDC_ISSUER_URL
              value: {{ required "config.oidc.issuerUrl is required when config.oidc.enabled is true" .Values.config.oidc.issuerUrl | quote }}
            - name: OPENLICENSD_OIDC_CLIENT_ID
              value: {{ required "config.oidc.clientId is required when config.oidc.enabled is true" .Values.config.oidc.clientId | quote }}
            - name: OPENLICENSD_OIDC_REDIRECT_URL
              value: {{ required "config.oidc.redirectUrl is required when config.oidc.enabled is true" .Values.config.oidc.redirectUrl | quote }}
            - name: OPENLICENSD_OIDC_SCOPES
              value: {{ .Values.config.oidc.scopes | quote }}
            - name: OPENLICENSD_OIDC_DEFAULT_ROLE
              value: {{ .Values.config.oidc.defaultRole | quote }}
            - name: OPENLICENSD_OIDC_PROVIDER_NAME
              value: {{ .Values.config.oidc.providerName | quote }}
            - name: OPENLICENSD_OIDC_ADMIN_EMAILS
              value: {{ .Values.config.oidc.adminEmails | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "openlicensd.secretName" . }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
