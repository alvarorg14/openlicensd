# -- Number of OpenLicensd replicas
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/alvarorg14/openlicensd
  # -- Image tag. Defaults to the chart appVersion when empty
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Secrets for pulling images from private registries
imagePullSecrets: []
# -- Override the chart name used in labels and resource names
nameOverride: ""
# -- Override the full release name used for all resources
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount for OpenLicensd
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- ServiceAccount name. Generated from the release fullname when empty and create is true
  name: ""

# -- Annotations to add to OpenLicensd pods
podAnnotations: {}
# -- Labels to add to OpenLicensd pods
podLabels: {}

# -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# -- Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- CPU and memory resource requests and limits for the OpenLicensd container
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 256Mi

# -- Node labels for pod assignment
nodeSelector: {}
# -- Tolerations for pod assignment
tolerations: []
# -- Affinity rules for pod assignment
affinity: {}

pdb:
  # -- Create a PodDisruptionBudget for OpenLicensd pods
  enabled: false
  # -- Minimum pods that must remain available during voluntary disruptions. When set (including 0), takes precedence over maxUnavailable. Leave empty to use maxUnavailable instead.
  minAvailable: ""
  # -- Maximum pods that may be unavailable during voluntary disruptions. Used when minAvailable is empty.
  maxUnavailable: 1
  # -- Annotations to add to the PodDisruptionBudget
  annotations: {}

config:
  # -- HTTP listen address (maps to OPENLICENSD_ADDR)
  addr: ":8080"
  # -- Session TTL in hours (maps to OPENLICENSD_SESSION_TTL_HOURS)
  sessionTTLHours: 24
  # -- Per-request context deadline in seconds; 0 disables (maps to OPENLICENSD_REQUEST_TIMEOUT_SECONDS)
  requestTimeoutSeconds: 30
  # -- Interval in minutes for deleting expired/revoked sessions; 0 disables (maps to OPENLICENSD_SESSION_CLEANUP_INTERVAL_MINUTES)
  sessionCleanupIntervalMinutes: 60
  # -- Set Secure flag on session cookies (maps to OPENLICENSD_COOKIE_SECURE)
  cookieSecure: true
  localLoginEnabled: true
  log:
    # -- Log level: debug, info, warn, or error (maps to OPENLICENSD_LOG_LEVEL)
    level: info
    # -- Log output format: json or text (maps to OPENLICENSD_LOG_FORMAT)
    format: json
  metrics:
    # -- Enable Prometheus /metrics on a dedicated listener (maps to OPENLICENSD_METRICS_ENABLED)
    enabled: true
    # -- Metrics listen address (maps to OPENLICENSD_METRICS_ADDR)
    addr: ":9090"
  database:
    # -- Maximum pool connections; 0 uses pgx default (maps to OPENLICENSD_DATABASE_MAX_CONNS)
    maxConns: 0
    # -- Minimum pool connections; 0 uses pgx default (maps to OPENLICENSD_DATABASE_MIN_CONNS)
    minConns: 0
    # -- Close idle connections after this many minutes; 0 uses pgx default (maps to OPENLICENSD_DATABASE_MAX_CONN_IDLE_MINUTES)
    maxConnIdleMinutes: 0
    # -- PostgreSQL statement_timeout in seconds; 0 leaves server default (maps to OPENLICENSD_DATABASE_STATEMENT_TIMEOUT_SECONDS)
    statementTimeoutSeconds: 0
  # -- Comma-separated trusted proxy IPs or CIDRs (maps to OPENLICENSD_TRUSTED_PROXIES)
  trustedProxies: ""
  rateLimit:
    # -- Enable per-IP rate limiting on unauthenticated endpoints (maps to OPENLICENSD_RATE_LIMIT_ENABLED)
    enabled: true
    # -- Rate limit backend: memory (per-replica) or postgres (shared across replicas) (maps to OPENLICENSD_RATE_LIMIT_BACKEND)
    backend: memory
    # -- Sustained request rate for /validate and /registry-credentials (maps to OPENLICENSD_RATE_LIMIT_PUBLIC_PER_MINUTE)
    publicPerMinute: 600
    # -- Burst capacity for public endpoints (maps to OPENLICENSD_RATE_LIMIT_PUBLIC_BURST)
    publicBurst: 60
    # -- Sustained request rate for login and OIDC endpoints (maps to OPENLICENSD_RATE_LIMIT_LOGIN_PER_MINUTE)
    loginPerMinute: 30
    # -- Burst capacity for login endpoints (maps to OPENLICENSD_RATE_LIMIT_LOGIN_BURST)
    loginBurst: 10
    # -- Minutes before unused per-IP buckets are evicted (maps to OPENLICENSD_RATE_LIMIT_IDLE_MINUTES)
    idleMinutes: 10
  bootstrapAdmin:
    # -- Email for the first admin user seeded on empty database (maps to OPENLICENSD_BOOTSTRAP_ADMIN_EMAIL)
    email: ""
    # -- Display name for the bootstrap admin (maps to OPENLICENSD_BOOTSTRAP_ADMIN_NAME)
    name: Administrator
  harbor:
    # -- Enable Harbor registry credentials endpoint
    enabled: false
    # -- Harbor base URL (maps to OPENLICENSD_HARBOR_URL)
    url: ""
    # -- Comma-separated Harbor project namespaces (maps to OPENLICENSD_HARBOR_PROJECTS)
    projects: ""
    # -- Robot account lifetime in days (maps to OPENLICENSD_HARBOR_ROBOT_DURATION_DAYS)
    robotDurationDays: 1
    # -- Prefix for generated robot account names (maps to OPENLICENSD_HARBOR_ROBOT_NAME_PREFIX)
    robotNamePrefix: openlicensd
    # -- Skip TLS verification for Harbor (maps to OPENLICENSD_HARBOR_INSECURE_SKIP_VERIFY)
    insecureSkipVerify: false
    # -- Log Harbor API requests/responses (maps to OPENLICENSD_HARBOR_DEBUG)
    debug: false
  oidc:
    # -- Enable OIDC SSO (maps to OPENLICENSD_OIDC_ENABLED)
    enabled: false
    # -- OIDC issuer URL (maps to OPENLICENSD_OIDC_ISSUER_URL)
    issuerUrl: ""
    # -- OAuth client ID (maps to OPENLICENSD_OIDC_CLIENT_ID)
    clientId: ""
    # -- Callback URL registered with the IdP (maps to OPENLICENSD_OIDC_REDIRECT_URL)
    redirectUrl: ""
    # -- Comma-separated scopes (maps to OPENLICENSD_OIDC_SCOPES)
    scopes: "openid,profile,email"
    # -- Default role for new SSO users (maps to OPENLICENSD_OIDC_DEFAULT_ROLE)
    defaultRole: viewer
    # -- SSO button label (maps to OPENLICENSD_OIDC_PROVIDER_NAME)
    providerName: SSO
    # -- Comma-separated admin emails on first SSO login (maps to OPENLICENSD_OIDC_ADMIN_EMAILS)
    adminEmails: ""

secret:
  # -- Secret provisioning mode: `create`, `existing`, or `externalSecrets`
  mode: create
  # -- Secret name when mode is `create` or `externalSecrets`. Defaults to `<release>-openlicensd-secret`
  name: ""
  # -- Name of an existing Secret when mode is `existing`
  existingSecret: ""
  # -- Secret data when mode is `create`
  data:
    # -- PostgreSQL connection URL (maps to OPENLICENSD_DATABASE_URL)
    databaseUrl: ""
    # -- Bcrypt hash for bootstrap admin password (maps to OPENLICENSD_BOOTSTRAP_ADMIN_PASSWORD_HASH)
    bootstrapAdminPasswordHash: ""
    # -- OIDC client secret (maps to OPENLICENSD_OIDC_CLIENT_SECRET)
    oidcClientSecret: ""
    # -- Harbor admin username (maps to OPENLICENSD_HARBOR_ADMIN_USERNAME)
    harborAdminUsername: ""
    # -- Harbor admin password (maps to OPENLICENSD_HARBOR_ADMIN_PASSWORD)
    harborAdminPassword: ""
  externalSecrets:
    # -- How often the ExternalSecret refreshes the target Secret
    refreshInterval: 1h
    # -- Reference to a SecretStore or ClusterSecretStore
    secretStoreRef:
      name: ""
      kind: SecretStore
    # -- Remote secret references. Each entry maps a Kubernetes Secret key to a remote property.
    # Example:
    # remoteRefs:
    #   - secretKey: OPENLICENSD_DATABASE_URL
    #     remoteRef:
    #       key: openlicensd/database
    #       property: url
    remoteRefs: []

service:
  # -- Kubernetes Service type
  type: ClusterIP
  # -- Service port exposed for the API and UI
  port: 8080
  # -- Annotations to add to the Service
  annotations: {}

ingress:
  # -- Create an Ingress resource
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress host rules
  hosts:
    - host: openlicensd.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []

# -- Extra environment variables for the OpenLicensd container
extraEnv: []
# -- Extra command-line arguments passed to OpenLicensd
extraArgs: []
