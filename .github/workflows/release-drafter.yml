name: Release Drafter

on:
  push:
    branches:
      - main
    paths-ignore:
      - "sdk/**"
      - "docs/sdk/**"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-release-drafter.yml"
      - ".github/release-drafter-sdk.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  update_release_draft:
    name: Update Stable Release Draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        with:
          config-name: release-drafter-template.yml
          prerelease: false
          include-pre-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_prerelease_draft:
    name: Update Prerelease Draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        with:
          config-name: release-drafter-template.yml
          prerelease: true
          prerelease-identifier: rc
          include-pre-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
