name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlicensd
          POSTGRES_PASSWORD: openlicensd
          POSTGRES_DB: openlicensd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlicensd -d openlicensd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Lint
        working-directory: server
        run: golangci-lint run ./...

      - name: Test
        working-directory: server
        env:
          OPENLICENSD_DATABASE_URL: postgres://openlicensd:openlicensd@localhost:5432/openlicensd?sslmode=disable
        run: go test ./...

      - name: Build
        working-directory: server
        run: go build -o /tmp/openlicensd ./cmd/openlicensd

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Generate
        working-directory: ui
        run: npm run generate

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/openlicensd -f charts/openlicensd/ci/test-values.yaml

      - name: Template chart
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml > /dev/null

      - name: Package chart
        run: helm package charts/openlicensd

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Lint OpenAPI spec
        run: npx @redocly/cli@latest lint docs/openapi.yaml --config docs/redocly.yaml
