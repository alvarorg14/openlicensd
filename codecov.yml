coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flag_management:
  individual_flags:
    - name: server
      paths:
        - server/
      carryforward: true
    - name: sdk
      paths:
        - sdk/go/
      carryforward: true

ignore:
  - server/internal/static/**
