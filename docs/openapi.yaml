openapi: 3.1.0
info:
  title: OpenLicensd API
  description: |
    HTTP API for OpenLicensd — an open source license server for creating and validating license keys.

    Admin endpoints accept either a session cookie (from `POST /api/v1/auth/login` or OIDC SSO) or a
    scoped API token via `Authorization: Bearer <token>`. Session-based unsafe methods also require
    the `X-CSRF-Token` header matching the `openlicensd_csrf` cookie; Bearer requests do not use CSRF.
    API token management (`/api/v1/api-tokens`) requires a session cookie (admin role).
    Public endpoints (`/validate`, `/registry-credentials`, `/auth/login`, OIDC login/callback) do not require authentication.
    Unauthenticated endpoints are rate limited per client IP; configure `OPENLICENSD_TRUSTED_PROXIES` behind a reverse proxy.
    API requests are bounded by `OPENLICENSD_REQUEST_TIMEOUT_SECONDS` (default `30`; `0` disables); exceeded deadlines return `504` with `{"error":"request timeout"}`.

    All responses include browser security headers: `Content-Security-Policy`, `X-Frame-Options`,
    and `X-Content-Type-Options`. When `OPENLICENSD_COOKIE_SECURE=true`, responses also include
    `Strict-Transport-Security`.

    The `/api/v1/registry-credentials` endpoint is only available when
    `OPENLICENSD_HARBOR_ENABLED=true` on the server.

    ## Role-based access control

    Authenticated endpoints enforce one of three roles. Insufficient role returns `403` with
    `{"error":"forbidden"}`.

    | Role | Permissions |
    |------|-------------|
    | `admin` | Full access including user management |
    | `operator` | Create, update, and delete licenses, products, and policies |
    | `viewer` | Read-only access to licenses, products, and policies |

    Any authenticated user (any role) may call `/api/v1/auth/me`. Session users may also call
    `/api/v1/auth/logout` and `/api/v1/auth/password` (not available for API token authentication).
  version: 0.0.0-dev
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: OpenLicensd
    url: https://github.com/alvarorg14/openlicensd

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://openlicensd.example.com
    description: Production

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Admin authentication and session management
  - name: Users
    description: User management (admin only)
  - name: API Tokens
    description: API token management for machine-to-machine access (admin session only)
  - name: Audit Log
    description: Append-only audit trail of admin mutations (admin only)
  - name: Products
    description: Product management
  - name: Policies
    description: Policy management
  - name: Licenses
    description: License management
  - name: Validation
    description: Public license validation
  - name: Registry
    description: Harbor registry credentials (optional, public)

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 when the HTTP server is accepting requests. Does not check external dependencies; use `/readyz` for database readiness.
      operationId: healthz
      responses:
        "200":
          description: Server is alive (no dependency checks)
      security: []

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Pings PostgreSQL via the connection pool (2-second timeout). Returns 503 when the database is unreachable.
      operationId: readyz
      responses:
        "200":
          description: Server is ready (database reachable)
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: database unavailable
      security: []

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Local login is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []

  /api/v1/auth/providers:
    get:
      tags: [Auth]
      summary: List enabled login methods
      operationId: listAuthProviders
      responses:
        "200":
          description: Enabled authentication providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
      security: []

  /api/v1/auth/oidc/login:
    get:
      tags: [Auth]
      summary: Start OIDC login
      description: Redirects to the configured identity provider. Only available when `OPENLICENSD_OIDC_ENABLED=true`.
      operationId: oidcLogin
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
          description: Relative path to redirect after successful login (default `/licenses`)
      responses:
        "302":
          description: Redirect to identity provider
        "404":
          description: OIDC is not enabled
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      description: Handles the authorization code callback from the identity provider. Sets session cookies and redirects into the app.
      operationId: oidcCallback
      responses:
        "302":
          description: Redirect to app or login page on failure
        "404":
          description: OIDC is not enabled
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: |
        Returns the currently authenticated user.

        **Required role:** any authenticated user (`admin`, `operator`, or `viewer`).
      operationId: getCurrentUser
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: |
        Revokes the current session and clears session cookies.

        **Required role:** any authenticated user (`admin`, `operator`, or `viewer`).
      operationId: logout
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Logged out successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/password:
    post:
      tags: [Auth]
      summary: Change own password
      description: |
        Changes the password for the currently authenticated user. Requires the current
        password. Only available for accounts with a local password (`has_password: true`).
        On success, all other sessions for the user are revoked; the current session
        remains valid.

        **Required role:** any authenticated user (`admin`, `operator`, or `viewer`).
      operationId: changeOwnPassword
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed successfully
        "400":
          description: Invalid request (wrong current password, password too short, or account has no local password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: |
        **Required role:** `admin`.
      operationId: listUsers
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/UserSort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
        "400":
          description: Invalid list parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

    post:
      tags: [Users]
      summary: Create a user
      description: |
        Creates a local user with a bcrypt-hashed password.

        **Required role:** `admin`.
      operationId: createUser
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body (missing email, name, or password; invalid role; or password too short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"

    patch:
      tags: [Users]
      summary: Update a user
      description: |
        Updates a user's email, name, and role.

        **Required role:** `admin`.
      operationId: updateUser
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user ID or request body (missing email, name, or invalid role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

    delete:
      tags: [Users]
      summary: Delete a user
      description: |
        Permanently deletes a user. Cannot delete your own account.

        **Required role:** `admin`.
      operationId: deleteUser
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: User deleted
        "400":
          description: Invalid user ID or cannot delete your own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"

    patch:
      tags: [Users]
      summary: Set user password
      description: |
        Sets or resets the password for a user (admin action). Does not require the current
        password. Minimum length is 8 characters. Store failures return `404`.

        **Required role:** `admin`.
      operationId: setUserPassword
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserPasswordRequest"
      responses:
        "204":
          description: Password set successfully
        "400":
          description: Invalid user ID, missing password, or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"

    patch:
      tags: [Users]
      summary: Disable a user
      description: |
        Disables a user account and revokes all of their sessions. Cannot disable your own account.

        **Required role:** `admin`.
      operationId: disableUser
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: User disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user ID or cannot disable your own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/UserId"

    patch:
      tags: [Users]
      summary: Enable a user
      description: |
        Re-enables a disabled user and clears failed-login lockout counters.

        **Required role:** `admin`.
      operationId: enableUser
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: User enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/api-tokens:
    get:
      tags: [API Tokens]
      summary: List API tokens
      description: |
        **Required role:** `admin`. **Authentication:** session cookie only (not Bearer tokens).

        Returns paginated API tokens including revoked tokens.
      operationId: listAPITokens
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ApiTokenSort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Paginated list of API tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApiTokens"
        "400":
          description: Invalid list parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

    post:
      tags: [API Tokens]
      summary: Create an API token
      description: |
        Creates a scoped API token. The raw token value is returned exactly once in the response.

        **Required role:** `admin`. **Authentication:** session cookie only (not Bearer tokens).
      operationId: createAPIToken
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: API token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenWithSecret"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/api-tokens/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/ApiTokenId"

    patch:
      tags: [API Tokens]
      summary: Revoke an API token
      description: |
        Revokes an API token. Revoked tokens remain listed but cannot authenticate.

        **Required role:** `admin`. **Authentication:** session cookie only (not Bearer tokens).
      operationId: revokeAPIToken
      security:
        - sessionAuth: []
      responses:
        "200":
          description: API token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        "400":
          description: Invalid API token ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/api-tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/ApiTokenId"

    delete:
      tags: [API Tokens]
      summary: Delete an API token
      description: |
        Permanently deletes an API token record.

        **Required role:** `admin`. **Authentication:** session cookie only (not Bearer tokens).
      operationId: deleteAPIToken
      security:
        - sessionAuth: []
      responses:
        "204":
          description: API token deleted
        "400":
          description: Invalid API token ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/audit-events:
    get:
      tags: [Audit Log]
      summary: List audit events
      description: |
        Returns a paginated, append-only audit trail of successful admin mutations.

        **Required role:** `admin`. Accepts session cookie or Bearer API token.

        Filter by `action`, `resource_type`, `actor_user_id`, `from`, and `to` (RFC3339 timestamps).
      operationId: listAuditEvents
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/AuditEventSort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/AuditEventAction"
        - $ref: "#/components/parameters/AuditEventResourceType"
        - $ref: "#/components/parameters/AuditEventActorUserID"
        - $ref: "#/components/parameters/AuditEventFrom"
        - $ref: "#/components/parameters/AuditEventTo"
      responses:
        "200":
          description: Paginated list of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuditEvents"
        "400":
          description: Invalid list parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      description: |
        **Required role:** `viewer`, `operator`, or `admin`.
      operationId: listProducts
      security:
        - sessionAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ProductSort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "400":
          description: Invalid list parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

    post:
      tags: [Products]
      summary: Create a product
      description: |
        **Required role:** `operator` or `admin`.
      operationId: createProduct
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"

    patch:
      tags: [Products]
      summary: Update a product
      description: |
        **Required role:** `operator` or `admin`.
      operationId: updateProduct
      security:
        - sessionAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

    delete:
      tags: [Products]
      summary: Delete a product
      description: |
        **Required role:** `operator` or `admin`.
      operationId: deleteProduct
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Product deleted
        "400":
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/policies:
    get:
      tags: [Policies]
      summary: List policies
      description: |
