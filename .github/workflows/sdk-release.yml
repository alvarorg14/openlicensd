name: SDK Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Release Go SDK
    if: ${{ startsWith(github.event.release.tag_name, 'sdk/go/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Assert SDK tag format
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^sdk/go/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "SDK release tag must be sdk/go/vX.Y.Z or sdk/go/vX.Y.Z-rc.N (got: $TAG)"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - name: Cache lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin
          key: ${{ runner.os }}-lint-tools-${{ hashFiles('Makefile') }}

      - name: Lint
        run: make lint-sdk

      - name: Test
        run: make test-sdk

      - name: Warm Go module proxy
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: GOPROXY=proxy.golang.org go list -m "github.com/alvarorg14/openlicensd/sdk/go@${TAG#sdk/go/}"
