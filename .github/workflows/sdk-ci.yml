name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"

permissions:
  contents: read

jobs:
  sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum

      - name: Cache lint tools
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-lint-tools-${{ hashFiles('Makefile') }}

      - name: Lint
        run: make lint-sdk

      - name: Test
        run: make test-sdk
