          type: string
        description:
          type: ["string", "null"]
        archived_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedProducts:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    Policy:
      type: object
      required: [id, product_id, product_name, name, expiration_basis, grace_period_days, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        duration_days:
          type: ["integer", "null"]
        expiration_basis:
          type: string
          enum: [on_creation, on_first_validation]
        grace_period_days:
          type: integer
        archived_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedPolicies:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    UpdateLicenseRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          example: Updated label
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Set to null for a key that never expires.

    License:
      type: object
      required:
        - id
        - label
        - key_prefix
        - product_id
        - product_code
        - product_name
        - policy_id
        - policy_name
        - revoked
        - created_at
        - validation_count
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        key_prefix:
          type: string
          description: First group of the license key (for display only)
          example: X4F9K
        product_id:
          type: string
          format: uuid
        product_code:
          type: string
        product_name:
          type: string
        policy_id:
          type: string
          format: uuid
        policy_name:
          type: string
        expires_at:
          type: ["string", "null"]
          format: date-time
        activated_at:
          type: ["string", "null"]
          format: date-time
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_validated_at:
          type: ["string", "null"]
          format: date-time
        validation_count:
          type: integer
          format: int64
        created_by:
          type: string
          format: uuid
        created_by_name:
          type: string
        created_by_email:
          type: string

    PaginatedLicenses:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/License"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    LicenseStats:
      type: object
      required: [total, active, expired, revoked]
      properties:
        total:
          type: integer
          format: int64
        active:
          type: integer
          format: int64
        expired:
          type: integer
          format: int64
        revoked:
          type: integer
          format: int64

    LicenseCreated:
      allOf:
        - $ref: "#/components/schemas/License"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Full license key. Returned only once at creation.
              example: X4F9K-7QP2M-3RH8N-BW6TG-YZ2CD

    ValidateRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Full license key
          example: X4F9K-7QP2M-3RH8N-BW6TG-YZ2CD
        product:
          type: string
          description: Optional product code to enforce product scoping

    ValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Present when the key is expired
        reason:
          type: string
          enum: [not_found, expired, revoked, product_mismatch]
          description: Present when valid is false
        product:
          type: string
          description: Product code for the matched license
        policy:
          type: string
          description: Policy name for the matched license
        in_grace_period:
          type: boolean
          description: True when the license is past expiry but still within the policy grace period

    RegistryCredentials:
      type: object
      required: [registry, username, secret, expires_at]
      properties:
        registry:
          type: string
          description: Harbor registry host
          example: harbor.example.com
        username:
          type: string
          description: Robot account username
          example: robot$myproject+openlicensd-x4f9k-123
        secret:
          type: string
          description: Robot account secret
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp when credentials expire
