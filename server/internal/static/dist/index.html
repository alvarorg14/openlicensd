<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLicensd</title>
  <meta name="description" content="Open source license server">
  <style>
    :root {
      color-scheme: light;
      --brand: #2F6FFF;
      --text: #1A2238;
      --muted: #6E7C93;
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --border: #E6EBF3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(100%, 36rem);
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: 0 12px 32px rgba(17, 28, 52, 0.08);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      color: var(--brand);
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.6;
    }

    p:last-child {
      margin-bottom: 0;
    }

    .muted {
      color: var(--muted);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95em;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.125rem 0.375rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>OpenLicensd</h1>
    <p>
      This binary embeds a placeholder admin UI. The API is available at
      <code>/api/v1</code>.
    </p>
    <p class="muted">
      Build the full Nuxt admin UI before shipping or developing against the embedded SPA:
      run <code>make ui</code> or <code>make build</code> from the repository root.
    </p>
  </main>
</body>
</html>
