name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "sdk/**"
      - "docs/sdk/**"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-release-drafter.yml"
      - ".github/release-drafter-sdk.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "sdk/**"
      - "docs/sdk/**"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-release-drafter.yml"
      - ".github/release-drafter-sdk.yml"

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openlicensd
          POSTGRES_PASSWORD: openlicensd
          POSTGRES_DB: openlicensd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlicensd -d openlicensd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Cache lint tools
        uses: actions/cache@v6
        with:
          path: bin
          key: ${{ runner.os }}-lint-tools-${{ hashFiles('Makefile') }}

      - name: Lint
        run: make lint-server

      - name: Test
        working-directory: server
        env:
          OPENLICENSD_DATABASE_URL: postgres://openlicensd:openlicensd@localhost:5432/openlicensd?sslmode=disable
        run: go test -p 1 ./...

      - name: Build
        working-directory: server
        run: go build -o /tmp/openlicensd ./cmd/openlicensd

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint
        run: make lint-ui

      - name: Generate
        run: make ui

      - name: Verify generated assets resolve
        run: |
          ASSET=$(grep -Eo 'href="/_nuxt/[^"]+\.(js|css)"' server/internal/static/dist/index.html | head -n1 | sed 's/.*href="\([^"]*\)".*/\1/')
          if [ -z "$ASSET" ]; then
            echo "No /_nuxt asset reference found in generated index.html"
            exit 1
          fi
          test -f "server/internal/static/dist${ASSET}"
          if ! grep -qr 'lucide' server/internal/static/dist/_nuxt/; then
            echo "No bundled Lucide icons found in generated client assets"
            exit 1
          fi

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.0
          args: check

      - name: Set GoReleaser snapshot tag
        run: |
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$TAG" ]; then TAG=v0.0.0; fi
          echo "GORELEASER_CURRENT_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Assert chart version placeholder
        run: grep -q '0.0.0-dev' charts/openlicensd/Chart.yaml

      - name: Lint chart
        run: helm lint charts/openlicensd -f charts/openlicensd/ci/test-values.yaml

      - name: Template chart
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml > /dev/null

      - name: Template chart with PDB enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set pdb.enabled=true > /dev/null

      - name: Template chart with HPA enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set autoscaling.enabled=true > /dev/null

      - name: Template chart with NetworkPolicy enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set networkPolicy.enabled=true > /dev/null

      - name: Template chart with ServiceMonitor enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set serviceMonitor.enabled=true > /dev/null

      - name: Template chart with topologySpreadConstraints
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set-json 'topologySpreadConstraints=[{"maxSkew":1,"topologyKey":"topology.kubernetes.io/zone","whenUnsatisfiable":"ScheduleAnyway","labelSelector":{"matchLabels":{"app.kubernetes.io/name":"openlicensd"}}}]' > /dev/null

      - name: Package chart
        run: helm package charts/openlicensd

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Assert OpenAPI version placeholder
        run: "grep -q 'version: 0.0.0-dev' docs/openapi.yaml"

      - name: Lint OpenAPI spec
        run: npx @redocly/cli@latest lint docs/openapi.yaml --config docs/redocly.yaml
