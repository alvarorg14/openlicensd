services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openlicensd
      POSTGRES_PASSWORD: openlicensd
      POSTGRES_DB: openlicensd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlicensd -d openlicensd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
