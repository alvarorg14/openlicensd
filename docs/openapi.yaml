      tags: [Licenses]
      summary: Release a license machine
      description: |
        **Required role:** `operator` or `admin`.

        Soft-deactivates the machine and frees one activation slot.
      operationId: releaseLicenseMachine
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Released machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseMachine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /api/v1/validate:
    post:
      tags: [Validation]
      summary: Validate a license key
      description: |
        Public endpoint. Returns HTTP 200 with a validation result when the request is allowed,
        even when the key is invalid. Invalid keys include a `reason` field.
        Rate-limited requests return HTTP 429.
      operationId: validateLicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          description: Invalid request body or missing key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
      security: []

  /api/v1/registry-credentials:
    post:
      tags: [Registry]
      summary: Issue Harbor registry credentials
      description: |
        Public endpoint. Available only when `OPENLICENSD_HARBOR_ENABLED=true`.
        When disabled, the route is not registered and requests return 404.

        Validates the license key and, if valid, creates a short-lived Harbor
        robot account with pull access to the configured projects.
      operationId: registryCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Registry credentials issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryCredentials"
        "400":
          description: Invalid request body or missing key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  value:
                    error: not_found
                expired:
                  value:
                    error: expired
                revoked:
                  value:
                    error: revoked
                product_mismatch:
                  value:
                    error: product_mismatch
                fingerprint_required:
                  value:
                    error: fingerprint_required
                activation_limit:
                  value:
                    error: activation_limit
                invalid:
                  value:
                    error: invalid
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "502":
          description: Harbor API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: failed to issue registry credentials
      security: []

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: openlicensd_session
      description: |
        Session cookie obtained from `POST /api/v1/auth/login` or OIDC SSO.
        Unsafe methods (POST, PATCH, DELETE) also require the `X-CSRF-Token` header
        set to the value of the `openlicensd_csrf` cookie.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Scoped API token created via `POST /api/v1/api-tokens` (admin session required).
        Present as `Authorization: Bearer <token>`. CSRF is not required for Bearer requests.

  parameters:
    LicenseId:
      name: id
      in: path
      required: true
      description: License UUID
      schema:
        type: string
        format: uuid
    ProductId:
      name: id
      in: path
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid
    PolicyId:
      name: id
      in: path
      required: true
      description: Policy UUID
      schema:
        type: string
        format: uuid
    UserId:
      name: id
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
    ApiTokenId:
      name: id
      in: path
      required: true
      description: API token UUID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of items per page
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive search term
    LicenseSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - created_at
          - label
          - expires_at
          - product_name
          - policy_name
          - last_validated_at
          - validation_count
        default: created_at
      description: Sort field for licenses
    ProductSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, updated_at, name, code]
        default: created_at
      description: Sort field for products
    PolicySort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, name, product_name, grace_period_days, max_activations]
        default: created_at
      description: Sort field for policies
    MachineSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, first_seen_at, last_seen_at, validation_count, fingerprint]
        default: created_at
      description: Sort field for license machines
    UserSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, updated_at, name, email, role, last_login_at]
        default: created_at
      description: Sort field for users
    ApiTokenSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, updated_at, name, role, last_used_at, expires_at]
        default: created_at
      description: Sort field for API tokens
    AuditEventSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [occurred_at, action, resource_type, actor_name]
        default: occurred_at
      description: Sort field for audit events
    AuditEventAction:
      name: action
      in: query
      required: false
      schema:
        type: string
      description: Filter by action (e.g. product.create, license.revoke)
    AuditEventResourceType:
      name: resource_type
      in: query
      required: false
      schema:
        type: string
      description: Filter by resource type (e.g. product, license, user)
    AuditEventActorUserID:
      name: actor_user_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: Filter by actor user ID (session-authenticated actions only)
    AuditEventFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Include events at or after this RFC3339 timestamp
    AuditEventTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Include events at or before this RFC3339 timestamp
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort direction

  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_session:
              value:
                error: invalid session
            invalid_api_token:
              value:
                error: invalid api token
            unauthorized:
              value:
                error: unauthorized
            missing_csrf:
              value:
                error: missing csrf token
            invalid_csrf:
              value:
                error: invalid csrf token
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: forbidden
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            license:
              value:
                error: license not found
            product:
              value:
                error: product not found
            policy:
              value:
                error: policy not found
            user:
              value:
                error: user not found
    Conflict:
      description: Resource conflict (unique constraint or referential integrity violation)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: resource is referenced by other records
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: Request deadline exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: request timeout
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the client may retry
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: rate limit exceeded

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message

    Role:
      type: string
      enum: [admin, operator, viewer]
      description: User role for RBAC

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required: [id, email, name, role, auth_provider, has_password]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        auth_provider:
          type: string
          example: local
        has_password:
          type: boolean
          description: Whether the account has a local password (false for OIDC-only accounts)
        picture_url:
          type: ["string", "null"]
          format: uri
          description: Profile photo URL from the OIDC provider (when available)

    CurrentUser:
      allOf:
        - $ref: "#/components/schemas/AuthUser"
        - type: object
          required: [server_version]
          properties:
            server_version:
              type: string
              description: Server build version ("dev" for unreleased builds)
              example: v0.2.0

    User:
      type: object
      required: [id, email, name, role, auth_provider, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        auth_provider:
          type: string
          example: local
          description: Authentication provider (`local` or `oidc`)
        disabled_at:
          type: string
          format: date-time
          description: Present when the account is disabled; omitted otherwise
        last_login_at:
          type: string
          format: date-time
          description: Last successful login time; omitted when the user has never logged in
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    ApiToken:
      type: object
      required: [id, name, token_prefix, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
          description: Display prefix of the token (full value shown only at creation)
        role:
          $ref: "#/components/schemas/Role"
        created_by:
          type: ["string", "null"]
          format: uuid
          description: Admin user who created the token (audit reference)
        last_used_at:
          type: ["string", "null"]
          format: date-time
        expires_at:
          type: ["string", "null"]
          format: date-time
        revoked_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApiTokenWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Raw bearer token (shown exactly once)

    PaginatedApiTokens:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    CreateApiTokenRequest:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          description: Unique display name for the token
        role:
          $ref: "#/components/schemas/Role"
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Optional expiration time (RFC3339); omit for no expiration

    AuditEvent:
      type: object
      required:
        - id
        - occurred_at
        - action
        - resource_type
        - actor_name
        - actor_role
        - auth_method
        - request_method
        - request_path
        - response_status
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
          description: Action identifier (e.g. product.create, user.disable)
        resource_type:
          type: string
        resource_id:
          type: ["string", "null"]
          format: uuid
        resource_label:
          type: ["string", "null"]
        actor_user_id:
          type: ["string", "null"]
          format: uuid
        actor_token_id:
          type: ["string", "null"]
          format: uuid
        actor_name:
          type: string
        actor_email:
          type: ["string", "null"]
        actor_token_prefix:
          type: ["string", "null"]
          description: Display prefix for API token actors (e.g. olsd_abcd1234)
        actor_role:
          $ref: "#/components/schemas/Role"
        auth_method:
          type: string
          enum: [session, api_token]
        client_ip:
          type: ["string", "null"]
        user_agent:
          type: ["string", "null"]
        request_id:
          type: ["string", "null"]
        request_method:
          type: string
        request_path:
          type: string
        response_status:
          type: integer
        metadata:
          type: ["object", "null"]
          additionalProperties: true

    PaginatedAuditEvents:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    CreateUserRequest:
      type: object
      required: [email, name, password, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          format: password
          minLength: 8
          description: Password (minimum 8 characters)
        role:
          $ref: "#/components/schemas/Role"

    UpdateUserRequest:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    SetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 8
          description: New password (minimum 8 characters)

    ChangePasswordRequest:
      type: object
      required: [current_password, password]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 8
          description: New password (minimum 8 characters)

    AuthProviders:
      type: object
      required: [local, oidc]
      properties:
        local:
          type: boolean
          description: Whether email/password login is enabled
        oidc:
          type: boolean
          description: Whether OIDC SSO is enabled
        oidc_name:
          type: string
          description: SSO button label (present when oidc is true)
        oidc_login_url:
          type: string
          description: URL to start OIDC login (present when oidc is true)

    CreateLicenseRequest:
      type: object
      required: [label, product_id, policy_id]
      properties:
        label:
          type: string
          description: Human-readable label for the license
          example: Acme Corp
        product_id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Optional override of the policy-derived expiration time.
        max_activations:
          type: ["integer", "null"]
          description: Optional override of the policy-derived activation limit.

    CreateProductRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          example: Acme Widget Pro
        code:
          type: string
          description: Stable machine identifier sent by clients during validation
          example: acme-widget
        description:
          type: ["string", "null"]

    UpdateProductRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]

    CreatePolicyRequest:
      type: object
      required: [product_id, name]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
          example: 30-day trial
        description:
          type: ["string", "null"]
        duration_days:
          type: ["integer", "null"]
          description: Null for perpetual policies
        expiration_basis:
          type: string
          enum: [on_creation, on_first_validation]
          default: on_creation
        grace_period_days:
          type: integer
          default: 0
        max_activations:
          type: ["integer", "null"]
          description: Maximum concurrent machine activations; null for unlimited

    UpdatePolicyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        duration_days:
          type: ["integer", "null"]
        expiration_basis:
          type: string
          enum: [on_creation, on_first_validation]
        grace_period_days:
          type: integer
        max_activations:
          type: ["integer", "null"]

    Product:
      type: object
      required: [id, name, code, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedProducts:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    Policy:
      type: object
      required:
        - id
        - product_id
        - product_name
        - name
        - description
        - duration_days
        - expiration_basis
        - grace_period_days
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        duration_days:
          type: ["integer", "null"]
        expiration_basis:
          type: string
          enum: [on_creation, on_first_validation]
        grace_period_days:
          type: integer
        max_activations:
          type: ["integer", "null"]
          description: Null means unlimited concurrent machine activations
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedPolicies:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    UpdateLicenseRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          example: Updated label
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Set to null for a key that never expires.
        max_activations:
          type: ["integer", "null"]
          description: Set to null for unlimited machine activations.

    License:
      type: object
      required:
        - id
        - label
        - key_prefix
        - product_id
        - product_code
        - product_name
        - policy_id
        - policy_name
        - expires_at
        - activated_at
        - revoked
        - created_at
        - last_validated_at
        - validation_count
        - max_activations
        - activation_count
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        key_prefix:
          type: string
          description: First group of the license key (for display only)
          example: X4F9K
        product_id:
          type: string
          format: uuid
        product_code:
          type: string
        product_name:
          type: string
        policy_id:
          type: string
          format: uuid
        policy_name:
          type: string
        expires_at:
          type: ["string", "null"]
          format: date-time
        activated_at:
          type: ["string", "null"]
          format: date-time
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_validated_at:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the last successful validation; omitted when never validated successfully
        validation_count:
          type: integer
          format: int64
          description: Number of successful validations; failed lookups do not increment this counter
        max_activations:
          type: ["integer", "null"]
          description: Snapshotted activation limit; null means unlimited
        activation_count:
          type: integer
          format: int64
          description: Number of active machines for this license
        created_by:
          type: string
          format: uuid
          description: ID of the user who created the license; omitted when unknown
        created_by_name:
          type: string
          description: Display name of the creator; omitted when unknown
        created_by_email:
          type: string
          format: email
          description: Email of the creator; omitted when unknown

    PaginatedLicenses:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/License"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    LicenseStats:
      type: object
      required: [total, active, expired, revoked]
      properties:
        total:
          type: integer
          format: int64
        active:
          type: integer
          format: int64
        expired:
          type: integer
          format: int64
        revoked:
          type: integer
          format: int64

    LicenseCreated:
      allOf:
        - $ref: "#/components/schemas/License"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Full license key. Returned only once at creation.
              example: X4F9K-7QP2M-3RH8N-BW6TG-YZ2CD

    ValidateRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Full license key
          example: X4F9K-7QP2M-3RH8N-BW6TG-YZ2CD
        product:
          type: string
          description: Optional product code to enforce product scoping
        fingerprint:
          type: string
          description: Stable machine identifier. Required when the license has a max activation limit.
        hostname:
          type: string
          description: Optional display hostname sent by the client (untrusted)

    ValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Expiration time of the matched license, when set
        reason:
          type: string
          enum: [not_found, expired, revoked, product_mismatch, fingerprint_required, activation_limit]
          description: Present when valid is false
        product:
          type: string
          description: Product code for the matched license
        policy:
          type: string
          description: Policy name for the matched license
        in_grace_period:
          type: boolean
          description: True when the license is past expiry but still within the policy grace period
        activation_count:
          type: integer
          format: int64
        max_activations:
          type: ["integer", "null"]

    UpdateLicenseMachineRequest:
      type: object
      properties:
        name:
          type: ["string", "null"]
          description: Admin display name for the machine

    LicenseMachine:
      type: object
      required:
        - id
        - license_id
        - fingerprint
        - display_name
        - first_seen_at
        - last_seen_at
        - validation_count
      properties:
        id:
          type: string
          format: uuid
        license_id:
          type: string
          format: uuid
        fingerprint:
          type: string
        name:
          type: ["string", "null"]
        hostname:
          type: ["string", "null"]
        display_name:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        last_seen_ip:
          type: ["string", "null"]
        validation_count:
          type: integer
          format: int64
        deactivated_at:
          type: ["string", "null"]
          format: date-time
        deactivated_by:
          type: ["string", "null"]
          format: uuid

    PaginatedLicenseMachines:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LicenseMachine"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    RegistryCredentials:
      type: object
      required: [registry, username, secret, expires_at]
      properties:
        registry:
          type: string
          description: Harbor registry host
          example: harbor.example.com
        username:
          type: string
          description: Robot account username
          example: robot$myproject+openlicensd-x4f9k-123
        secret:
          type: string
          description: Robot account secret
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp when credentials expire
