{{- if eq .Values.secret.mode "externalSecrets" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "openlicensd.secretName" . }}
  labels:
    {{- include "openlicensd.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "secret.externalSecrets.secretStoreRef.name is required when secret.mode is externalSecrets" .Values.secret.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secret.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "openlicensd.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secret.externalSecrets.remoteRefs }}
    - secretKey: {{ required "secretKey is required for each remoteRef" .secretKey }}
      remoteRef:
        key: {{ required "remoteRef.key is required for each remoteRef" .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
        {{- if .remoteRef.version }}
        version: {{ .remoteRef.version }}
        {{- end }}
    {{- end }}
{{- end }}
