openapi: 3.1.0
info:
  title: OpenLicensd API
  description: |
    HTTP API for OpenLicensd — an open source license server for creating and validating license keys.

    Admin endpoints require a session cookie obtained from `POST /api/v1/auth/login`.
    Unsafe methods also require the `X-CSRF-Token` header matching the `openlicensd_csrf` cookie.
    Public endpoints (`/validate`, `/registry-credentials`) do not require authentication.

    The `/api/v1/registry-credentials` endpoint is only available when
    `OPENLICENSD_HARBOR_ENABLED=true` on the server.
  version: 0.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: OpenLicensd
    url: https://github.com/alvarorg14/openlicensd

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://openlicensd.example.com
    description: Production

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Admin authentication
  - name: Products
    description: Product management (admin only)
  - name: Policies
    description: Policy management (admin only)
  - name: Licenses
    description: License management (admin only)
  - name: Validation
    description: Public license validation
  - name: Registry
    description: Harbor registry credentials (optional, public)

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: Server is alive
      security: []

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: Server is ready (database reachable)
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Local login is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []

  /api/v1/auth/providers:
    get:
      tags: [Auth]
      summary: List enabled login methods
      operationId: listAuthProviders
      responses:
        "200":
          description: Enabled authentication providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
      security: []

  /api/v1/auth/oidc/login:
    get:
      tags: [Auth]
      summary: Start OIDC login
      description: Redirects to the configured identity provider. Only available when `OPENLICENSD_OIDC_ENABLED=true`.
      operationId: oidcLogin
      parameters:
        - name: return_to
          in: query
          required: false
          schema:
            type: string
          description: Relative path to redirect after successful login (default `/licenses`)
      responses:
        "302":
          description: Redirect to identity provider
        "404":
          description: OIDC is not enabled
      security: []

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      description: Handles the authorization code callback from the identity provider. Sets session cookies and redirects into the app.
      operationId: oidcCallback
      responses:
        "302":
          description: Redirect to app or login page on failure
        "404":
          description: OIDC is not enabled
      security: []

  /api/v1/auth/password:
    post:
      tags: [Auth]
      summary: Change own password
      description: |
        Changes the password for the currently authenticated user. Requires the current
        password. Only available for accounts with a local password (`has_password: true`).
        On success, all other sessions for the user are revoked; the current session
        remains valid.
      operationId: changeOwnPassword
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed successfully
        "400":
          description: Invalid request (wrong current password, password too short, or account has no local password)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "400":
          description: Invalid list parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Product code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"

    patch:
      tags: [Products]
      summary: Update a product
      operationId: updateProduct
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Product code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Products]
      summary: Delete a product
      operationId: deleteProduct
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Product deleted
        "400":
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Product is referenced by policies or licenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/policies:
    get:
      tags: [Policies]
      summary: List policies
      operationId: listPolicies
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - name: product_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter policies by product
      responses:
        "200":
          description: Paginated list of policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPolicies"
        "400":
          description: Invalid list parameters or product_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Policies]
      summary: Create a policy
      operationId: createPolicy
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Policy name already exists for product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/policies/{id}:
    parameters:
      - $ref: "#/components/parameters/PolicyId"

    patch:
      tags: [Policies]
      summary: Update a policy
      operationId: updatePolicy
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePolicyRequest"
      responses:
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Invalid policy ID or request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Policy name already exists for product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Policies]
      summary: Delete a policy
      operationId: deletePolicy
      security:
        - sessionAuth: []
      responses:
        "204":
          description: Policy deleted
        "400":
          description: Invalid policy ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Policy is assigned to licenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/licenses/stats:
    get:
      tags: [Licenses]
      summary: License status counts
      operationId: getLicenseStats
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Aggregate license counts by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/licenses:
    get:
      tags: [Licenses]
      summary: List licenses
      operationId: listLicenses
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, expired, revoked]
          description: Filter licenses by status
        - name: product_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter licenses by product
        - name: policy_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter licenses by policy
      responses:
        "200":
          description: Paginated list of licenses (raw keys are never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLicenses"
        "400":
          description: Invalid list parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Licenses]
      summary: Create a license
      description: |
        Generates a new license key and returns it once in the response.
        Only the key prefix is stored for display; the full key cannot be retrieved later.
      operationId: createLicense
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicenseRequest"
      responses:
        "201":
          description: License created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseCreated"
        "400":
          description: Invalid request body or missing label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/licenses/{id}:
    parameters:
      - $ref: "#/components/parameters/LicenseId"

    patch:
      tags: [Licenses]
      summary: Update a license
      operationId: updateLicense
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLicenseRequest"
      responses:
        "200":
          description: License updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
        "400":
          description: Invalid license ID, request body, or missing label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Licenses]
      summary: Delete a license
      operationId: deleteLicense
      security:
        - sessionAuth: []
      responses:
        "204":
          description: License deleted
        "400":
          description: Invalid license ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/licenses/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/LicenseId"
    patch:
      tags: [Licenses]
      summary: Revoke a license
      description: Revoked licenses fail validation immediately.
      operationId: revokeLicense
      security:
        - sessionAuth: []
      responses:
        "200":
          description: License revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
        "400":
          description: Invalid license ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/licenses/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/LicenseId"
    patch:
      tags: [Licenses]
      summary: Activate a revoked license
      operationId: activateLicense
      security:
        - sessionAuth: []
      responses:
        "200":
          description: License activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/License"
        "400":
          description: Invalid license ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/validate:
    post:
      tags: [Validation]
      summary: Validate a license key
      description: |
        Public endpoint. Always returns HTTP 200 with a validation result,
        even when the key is invalid. Invalid keys include a `reason` field.
      operationId: validateLicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "400":
          description: Invalid request body or missing key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
      security: []

  /api/v1/registry-credentials:
    post:
      tags: [Registry]
      summary: Issue Harbor registry credentials
      description: |
        Public endpoint. Available only when `OPENLICENSD_HARBOR_ENABLED=true`.
        When disabled, the route is not registered and requests return 404.

        Validates the license key and, if valid, creates a short-lived Harbor
        robot account with pull access to the configured projects.
      operationId: registryCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Registry credentials issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryCredentials"
        "400":
          description: Invalid request body or missing key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Invalid license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  value:
                    error: not_found
                expired:
                  value:
                    error: expired
                revoked:
                  value:
                    error: revoked
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Harbor API failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: failed to issue registry credentials
      security: []

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: openlicensd_session
      description: |
        Session cookie obtained from `POST /api/v1/auth/login`.
        Unsafe methods (POST, PATCH, DELETE) also require the `X-CSRF-Token` header
        set to the value of the `openlicensd_csrf` cookie.

  parameters:
    LicenseId:
      name: id
      in: path
      required: true
      description: License UUID
      schema:
        type: string
        format: uuid
    ProductId:
      name: id
      in: path
      required: true
      description: Product UUID
      schema:
        type: string
        format: uuid
    PolicyId:
      name: id
      in: path
      required: true
      description: Policy UUID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Number of items per page
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: Case-insensitive search term
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: created_at
      description: Sort field (allowlist varies by resource)
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort direction

  responses:
    Unauthorized:
      description: Missing or invalid authorization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              value:
                error: missing authorization header
            invalid:
              value:
                error: invalid token
    NotFound:
      description: License not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: license not found
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required: [id, email, name, role, auth_provider, has_password]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, operator, viewer]
        auth_provider:
          type: string
          example: local
        has_password:
          type: boolean
          description: Whether the account has a local password (false for OIDC-only accounts)

    ChangePasswordRequest:
      type: object
      required: [current_password, password]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 8
          description: New password (minimum 8 characters)

    AuthProviders:
      type: object
      required: [local, oidc]
      properties:
        local:
          type: boolean
          description: Whether email/password login is enabled
        oidc:
          type: boolean
          description: Whether OIDC SSO is enabled
        oidc_name:
          type: string
          description: SSO button label (present when oidc is true)
        oidc_login_url:
          type: string
          description: URL to start OIDC login (present when oidc is true)

    CreateLicenseRequest:
      type: object
      required: [label, product_id, policy_id]
      properties:
        label:
          type: string
          description: Human-readable label for the license
          example: Acme Corp
        product_id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Optional override of the policy-derived expiration time.

    CreateProductRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          example: Acme Widget Pro
        code:
          type: string
          description: Stable machine identifier sent by clients during validation
          example: acme-widget
        description:
          type: ["string", "null"]

    UpdateProductRequest:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]

    CreatePolicyRequest:
      type: object
      required: [product_id, name]
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
          example: 30-day trial
        description:
          type: ["string", "null"]
        duration_days:
          type: ["integer", "null"]
          description: Null for perpetual policies
        expiration_basis:
          type: string
          enum: [on_creation, on_first_validation]
          default: on_creation
        grace_period_days:
          type: integer
          default: 0

    UpdatePolicyRequest:
