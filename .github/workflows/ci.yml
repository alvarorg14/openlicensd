name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "sdk/**"
      - "docs/sdk/**"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-release-drafter.yml"
      - ".github/release-drafter-sdk.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "sdk/**"
      - "docs/sdk/**"
      - ".github/workflows/sdk-ci.yml"
      - ".github/workflows/sdk-release.yml"
      - ".github/workflows/sdk-release-drafter.yml"
      - ".github/release-drafter-sdk.yml"

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openlicensd
          POSTGRES_PASSWORD: openlicensd
          POSTGRES_DB: openlicensd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlicensd -d openlicensd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Cache lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin
          key: ${{ runner.os }}-lint-tools-${{ hashFiles('Makefile') }}

      - name: Lint
        run: make lint-server

      - name: Test
        working-directory: server
        env:
          OPENLICENSD_DATABASE_URL: postgres://openlicensd:openlicensd@localhost:5432/openlicensd?sslmode=disable
        run: go test -p 1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: server/coverage.out
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        working-directory: server
        run: go build -o /tmp/openlicensd ./cmd/openlicensd

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Lint
        run: make lint-ui

      - name: Generate
        run: make ui

      - name: Verify generated assets resolve
        run: |
          ASSET=$(grep -Eo 'href="/_nuxt/[^"]+\.(js|css)"' server/internal/static/dist/index.html | head -n1 | sed 's/.*href="\([^"]*\)".*/\1/')
          if [ -z "$ASSET" ]; then
            echo "No /_nuxt asset reference found in generated index.html"
            exit 1
          fi
          test -f "server/internal/static/dist${ASSET}"
          if ! grep -qr 'lucide' server/internal/static/dist/_nuxt/; then
            echo "No bundled Lucide icons found in generated client assets"
            exit 1
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: openlicensd
          POSTGRES_PASSWORD: openlicensd
          POSTGRES_DB: openlicensd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openlicensd -d openlicensd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Build UI and server
        run: make ui && make server

      - name: Run Playwright smoke test
        env:
          OPENLICENSD_DATABASE_URL: postgres://openlicensd:openlicensd@localhost:5432/openlicensd?sslmode=disable
          OPENLICENSD_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          OPENLICENSD_BOOTSTRAP_ADMIN_NAME: Administrator
          OPENLICENSD_BOOTSTRAP_ADMIN_PASSWORD_HASH: $2a$10$w6lsMGg4BZVLWv0dqUXT2eUWcWhbh99FIECbPlBNeE.pu089T5E/2
          OPENLICENSD_COOKIE_SECURE: false
          OPENLICENSD_LOCAL_LOGIN_ENABLED: true
          OPENLICENSD_METRICS_ENABLED: false
          CI: true
        run: make test-ui

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a0c3fa7f99bf17df93888f6d9ccd173fc7 # v4.6.0
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.1
          args: check

      - name: Set GoReleaser snapshot tag
        run: |
          TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$TAG" ]; then TAG=v0.0.0; fi
          echo "GORELEASER_CURRENT_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.51.1

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.1
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive SBOMs were generated
        run: |
          count=$(find dist -name '*.spdx.json' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No SPDX SBOM files found under dist/"
            find dist -type f || true
            exit 1
          fi
          echo "Generated $count SPDX SBOM file(s):"
          find dist -name '*.spdx.json'

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Assert chart version placeholder
        run: grep -q '0.0.0-dev' charts/openlicensd/Chart.yaml

      - name: Lint chart
        run: helm lint charts/openlicensd -f charts/openlicensd/ci/test-values.yaml

      - name: Template chart
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml > /dev/null

      - name: Template chart with PDB enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set pdb.enabled=true > /dev/null

      - name: Template chart with HPA enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set autoscaling.enabled=true > /dev/null

      - name: Template chart with NetworkPolicy enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set networkPolicy.enabled=true > /dev/null

      - name: Template chart with ServiceMonitor enabled
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set serviceMonitor.enabled=true > /dev/null

      - name: Template chart with topologySpreadConstraints
        run: helm template test charts/openlicensd -f charts/openlicensd/ci/test-values.yaml --set-json 'topologySpreadConstraints=[{"maxSkew":1,"topologyKey":"topology.kubernetes.io/zone","whenUnsatisfiable":"ScheduleAnyway","labelSelector":{"matchLabels":{"app.kubernetes.io/name":"openlicensd"}}}]' > /dev/null

      - name: Package chart
        run: helm package charts/openlicensd

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Assert OpenAPI version placeholder
        run: "grep -q 'version: 0.0.0-dev' docs/openapi.yaml"

      - name: Lint OpenAPI spec
        # renovate: datasource=npm depName=@redocly/cli
        run: npx @redocly/cli@2.51.2 lint docs/openapi.yaml --config docs/redocly.yaml
