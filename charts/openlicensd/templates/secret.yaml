{{- if eq .Values.secret.mode "create" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openlicensd.secretName" . }}
  labels:
    {{- include "openlicensd.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENLICENSD_DATABASE_URL: {{ required "secret.data.databaseUrl is required when secret.mode is create" .Values.secret.data.databaseUrl | quote }}
  OPENLICENSD_BOOTSTRAP_ADMIN_PASSWORD_HASH: {{ required "secret.data.bootstrapAdminPasswordHash is required when secret.mode is create" .Values.secret.data.bootstrapAdminPasswordHash | quote }}
  {{- if .Values.config.oidc.enabled }}
  OPENLICENSD_OIDC_CLIENT_SECRET: {{ required "secret.data.oidcClientSecret is required when config.oidc.enabled is true and secret.mode is create" .Values.secret.data.oidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.config.harbor.enabled }}
  OPENLICENSD_HARBOR_ADMIN_USERNAME: {{ required "secret.data.harborAdminUsername is required when config.harbor.enabled is true and secret.mode is create" .Values.secret.data.harborAdminUsername | quote }}
  OPENLICENSD_HARBOR_ADMIN_PASSWORD: {{ required "secret.data.harborAdminPassword is required when config.harbor.enabled is true and secret.mode is create" .Values.secret.data.harborAdminPassword | quote }}
  {{- end }}
{{- end }}
