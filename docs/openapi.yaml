  /api/v1/licenses/{id}/machines/{machineId}:
    parameters:
      - $ref: "#/components/parameters/LicenseId"
      - name: machineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Licenses]
      summary: Rename a license machine
      description: |
        **Required role:** `operator` or `admin`.
      operationId: updateLicenseMachine
      security:
        - sessionAuth: []
        - bearerAuth: []
