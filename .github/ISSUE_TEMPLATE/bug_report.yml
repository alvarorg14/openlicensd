name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
      placeholder: License validation returns valid=true for a revoked key...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenLicensd version
      placeholder: v0.1.0 or image tag
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Helm
        - Docker
        - Binary
        - Local development
    validations:
      required: true

  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: "16"
    validations:
      required: false

  - type: dropdown
    id: harbor
    attributes:
      label: Harbor integration enabled?
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant environment variables or Helm values (redact secrets).
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs around the time of the issue.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
    validations:
      required: false
